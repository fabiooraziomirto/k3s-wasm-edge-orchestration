# Minimal scrape-only Prometheus config: no Alertmanager, no remote-write,
# no Grafana. See k8s/monitoring/README.md for how to query it directly
# (port-forward + curl, or the `promtool`/HTTP API) and for the caveats on
# what these numbers do and don't isolate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: wasmbed-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s

    scrape_configs:
      # Kepler DaemonSet: one target per node (hostNetwork pod, port 9102).
      - job_name: kepler
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["wasmbed-monitoring"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: kepler-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__address__]
            regex: '(.+):\d+'
            replacement: '${1}:9102'
            target_label: __address__

      # Any wasmbed-namespace pod that opts in via annotations. Nothing
      # in crates/ exposes /metrics yet (see doc/energy-tracking-assessment.md,
      # section 2) — this is here so the fuel-metering exporter proposed in
      # Phase 2 needs zero Prometheus config changes to be picked up.
      - job_name: wasmbed-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["wasmbed"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '${1}:${2}'
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

    rule_files:
      - /etc/prometheus/rules/*.yaml
