# SPDX-License-Identifier: Apache-2.0
# Zephyr configuration for Wasmbed application
# Based on working dhcpv4_client sample

# Required by WAMR_BUILD_LIBC_WASI=1 (zephyr-app/CMakeLists.txt) on Zephyr.
# Confirmed 2026-07-28 on the first real build attempt against this
# prj.conf (Zephyr v3.7.0 + WAMR): without CONFIG_REQUIRES_FULL_LIBC, the
# WASI layer's own posix.c fails to compile ("invalid use of incomplete
# typedef 'os_timespec'" / "storage size of 'ts' isn't known") because
# Zephyr's minimal libc doesn't provide a complete `struct timespec`.
# Without CONFIG_FILE_SYSTEM(_LITTLEFS), WAMR's zephyr_file.c (which
# unconditionally includes <zephyr/fs/littlefs.h>) fails with
# "lfs.h: No such file or directory" -- that header is only wired to the
# real littlefs library when the fs subsystem is enabled. Both are set in
# WAMR's own official Zephyr+WASI sample
# (wamr/product-mini/platforms/zephyr/simple-file/prj.conf), confirming
# this is a genuinely required pairing, not a version-specific workaround.
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Network stack (from dhcpv4_client - working configuration)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
# Needed by NET_REQUEST_ETHERNET_SET_MAC_ADDRESS: each emulated instance is
# given its own MAC at boot (see apply_injected_mac in network_handler.c),
# otherwise the whole fleet shares the driver's built-in address and one lease.
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Random number generator (required for network stack)
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# Logging (from dhcpv4_client - working configuration)
CONFIG_NET_LOG=y
CONFIG_LOG=y
# Note: NOT using CONFIG_LOG_MODE_IMMEDIATE - this might cause issues

# Network shell (useful for debugging)
CONFIG_NET_SHELL=y

# TLS support (for Wasmbed)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# Mutual TLS: the device presents a client certificate signed by the fleet CA
# and verifies the gateway against that same CA. Three credentials are
# registered under one security tag (CA, own certificate, private key), see
# network_set_tls_credentials in src/network_handler.c.
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4

# Proof of possession: the device signs the gateway's enrollment nonce.
# CTR_DRBG + ENTROPY because mbedtls_pk_sign needs an RNG for ECDSA, PK_WRITE
# for the signature encoding. There is deliberately no CONFIG for PK parsing or
# SHA-256: neither MBEDTLS_PK_PARSE_C nor MBEDTLS_SHA256 is a Kconfig symbol
# here (checked against the lab Zephyr 3.5 tree), and both are already provided
# by the TLS profile -- PK_PARSE_C via X509_CRT_PARSE_C in
# modules/mbedtls/configs/config-tls-generic.h, SHA-256 via the
# ...AES_128_GCM_SHA256 cipher suites. Setting an undefined symbol is a hard
# build error, not a no-op.
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
CONFIG_MBEDTLS_ENTROPY_ENABLED=y

# Enable ECDHE-ECDSA cipher suite (gateway now uses ECDSA P-256 certificate)
# Keep RSA enabled for compatibility during transition
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
# The 4 symbols this replaces (MBEDTLS_HASH_SHA384_ENABLED,
# MBEDTLS_HASH_SHA512_ENABLED, MBEDTLS_MAC_SHA384_ENABLED,
# MBEDTLS_MAC_SHA512_ENABLED) do not exist in this Zephyr version's mbedtls
# Kconfig glue (zephyr/modules/mbedtls/Kconfig.tls-generic) -- confirmed
# 2026-07-28 building against Zephyr v3.7.0, the first real build attempt
# against this prj.conf (no Zephyr SDK/workspace existed anywhere before).
# Assigning a value to an undefined Kconfig symbol is a hard build error in
# Zephyr ("Aborting due to Kconfig warnings"), not a silent no-op. The real
# symbols are MBEDTLS_SHA384/MBEDTLS_SHA512 (hash only -- there is no
# separate MAC-specific enable symbol in this Kconfig; HMAC-SHA384/512
# usage is gated solely by the hash algorithm being enabled).
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_SHA512=y

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=4096

# TLS heap for MbedTLS: RSA-2048 ServerKeyExchange verification needs ~22KB peak
# (SSL buffers 2*4096 + handshake overhead ~10KB, then RSA-2048 MPI ops ~12KB).
# 16KB caused MBEDTLS_ERR_MPI_ALLOC_FAILED; 32KB gives enough headroom.
# It cannot simply be raised for client authentication: on stm32f746g_disco
# CONFIG_SRAM_SIZE is 256KB and 64KB overflowed the RAM region by ~31KB at
# link time. The credential buffers in wasmbed_protocol.c are sized against
# the same budget.
CONFIG_MBEDTLS_HEAP_SIZE=32768

# Increase TLS record buffer: default 1500 is too small for RSA-2048 cert from
# Rustls gateway (cert ~1305 DER bytes + handshake overhead > 1500). Increasing
# to 4096 allows the combined Certificate+ServerKeyExchange record to be parsed.
# The records added by client authentication (CertificateRequest inbound, this
# device's ~550-byte certificate outbound) fit inside the same 4096.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096

# Threading
CONFIG_MULTITHREADING=y

# Main stack size: 4KB needed for WAMR module instantiation (wasm_runtime_instantiate
# calls several layers of internal functions that overflow the 2KB default).
CONFIG_MAIN_STACK_SIZE=4096

# Increase TCP workqueue stack size for TLS ECDHE operations (default 1024 is too small)
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096

# UART for logging
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Device drivers
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# POSIX API disabled: struct timespec è già risolto con #include <time.h>
# in platform_internal.h (patch Zephyr 3.5). POSIX_API=y causa eof nei
# TLS handshake Zephyr perché ridefinisce le socket ops in modo incompatibile.
CONFIG_POSIX_API=n

# Enable file system layer so WAMR zephyr_file.c links (fs_stat, fs_open, etc.)
# WAMR WASI includes file ops even when only sockets are used at runtime.
CONFIG_FILE_SYSTEM=y

# Note: NOT disabling MPU - dhcpv4_client works with MPU enabled
# CONFIG_ARM_MPU=n  # Removed - dhcpv4_client works with MPU